; Copiar este ficheiro para:
; %APPDATA%\DelphiLLMsClient\settings.ini
;
; No Windows será normalmente:
; C:\Users\<utilizador>\AppData\Roaming\DelphiLLMsClient\settings.ini
;
; Não colocar chaves reais neste ficheiro se ele for versionado no Git.

[General]
; Valores possíveis: OpenAI, Gemini, Claude, Grok, OpenRouter, OpenClaw
Provider=OpenAI

; Campos legados/activos para o provider actualmente seleccionado.
; A aplicação passa a preferir as secções [Models] e [BaseUrls].
Model=gpt-4.1-mini
BaseUrl=https://api.openai.com/v1

; 1 = enviar histórico local completo; 0 = enviar apenas a última mensagem.
KeepLocalContext=1

; Timeout das respostas em segundos.
TimeoutSeconds=120

[Models]
; Cada provider tem o seu modelo por defeito independente.
OpenAI=gpt-4.1-mini
Gemini=gemini-2.0-flash
Claude=claude-3-5-sonnet-latest
Grok=grok-2-latest
OpenRouter=openai/gpt-4o-mini
OpenClaw=openclaw/default

[BaseUrls]
; Cada provider tem o seu Base URL independente.
OpenAI=https://api.openai.com/v1
Gemini=https://generativelanguage.googleapis.com/v1beta
Claude=https://api.anthropic.com/v1
Grok=https://api.x.ai/v1
OpenRouter=https://openrouter.ai/api/v1
OpenClaw=http://192.168.93.35:18789

[Secrets]
; Cada provider tem a sua chave independente.
OpenAIApiKey=COLOCAR_OPENAI_API_KEY_AQUI
GeminiApiKey=COLOCAR_GEMINI_API_KEY_AQUI
ClaudeApiKey=COLOCAR_CLAUDE_API_KEY_AQUI
GrokApiKey=COLOCAR_GROK_API_KEY_AQUI
OpenRouterApiKey=COLOCAR_OPENROUTER_API_KEY_AQUI

; Campo legado mantido por compatibilidade. A aplicação passa a preferir os campos acima.
ApiKey=

; Usado apenas por OpenClaw.
OpenClawToken=COLOCAR_TOKEN_OPENCLAW_AQUI

[OpenClaw]
; Campo usado como SessionKey pelo OpenClaw.
; Usar uma SessionKey diferente por finalidade evita misturar contextos.
Endpoint=DelphiClient-default
